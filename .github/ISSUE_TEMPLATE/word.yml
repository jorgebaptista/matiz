name: Suggest or correct a word
description: Help fluent speakers find the right word.
body:
  - type: input
    id: word
    attributes:
      label: Language and word
      placeholder: pt-PT · renitente
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Suggestion or correction
      description: "Suggest a band using the [difficulty guide](https://github.com/jorgebaptista/matiz/blob/main/CONTRIBUTING.md#choose-a-difficulty), or tell us which answers both fit. An example or dictionary link helps."
    validations:
      required: true
