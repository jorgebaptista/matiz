name: Suggest or correct a word
description: Help fluent speakers find the right word.
body:
  - type: input
    id: word
    attributes:
      label: Language and word
      placeholder: pt-PT · renitente
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Suggestion or correction
      description: What sense do you have in mind? Is another answer equally defensible? Include an original example and a dictionary link if available.
    validations:
      required: true
