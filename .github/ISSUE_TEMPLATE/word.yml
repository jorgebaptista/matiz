name: Suggest or correct a word
description: Help fluent speakers find the right word.
body:
  - type: input
    id: word
    attributes:
      label: Language and word
      placeholder: pt-PT · renitente
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Suggestion or correction
      description: Which choices fit the word as shown? Include the phrase and choices if reporting a question. For a new word, give an original example and a dictionary link if available.
    validations:
      required: true
