<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#174f42">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <!-- public-links -->
  <link rel="stylesheet" href="../../site.css">
</head>
<body>
  <header><a class="brand" href="../../">Matiz</a><span>{{languageName}}</span></header>
  <main class="intro">
    <div><h1>{{heroTitle}}</h1><p>{{description}}</p><a class="play" href="../../{{route}}">{{play}} <span aria-hidden="true">→</span></a></div>
    <aside lang="{{locale}}"><small>{{example}}</small><h2>{{word}}</h2><p>{{prompt}}</p><details><summary>{{result}}</summary><strong>{{answer}}</strong><p>{{sentence}}</p></details></aside>
  </main>
  <footer><a href="../../" lang="en">All languages</a><a href="../../{{route}}index.html" download="Matiz-{{locale}}.html">{{downloadGame}}</a><a href="https://github.com/jorgebaptista/matiz#credits">{{credits}}</a></footer>
</body></html>
