<!doctype html>
<html lang="{{locale}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ed"><meta name="description" content="{{description}}"><title>{{title}}</title>
<meta name="matiz-play-url" content="{{playUrl}}">
<style>/* GAME_CSS */</style></head>
<body><main id="game"></main><p hidden role="status" id="storage-alert">{{storageAlert}}</p>
<template id="edition-picker"><select class="locale" aria-label="{{switchLanguage}}"><!-- edition-options --></select></template>
<template id="credits">
  <footer class="credits"><details>
    <summary>{{credits}}</summary>
    <p><strong>{{openquizLabel}}</strong> {{openquizCredit}}</p>
    <p><strong>{{magooshLabel}}</strong> {{magooshCredit}}</p>
    <p><strong>{{typographyLabel}}</strong> {{typographyCredit}}</p>
    <!-- LICENSES -->
  </details></footer>
</template>
<script>/* GAME_JS */</script>
</body></html>
